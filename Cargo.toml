[workspace]
resolver = "2"
members = [
    "crates/colibri-core",
    "crates/colibri-sim",
    "crates/colibri-windows",
    "crates/colibri-spotread",
    "crates/colibri-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/cosimo/colibri"
rust-version = "1.82"

[workspace.lints.rust]
unsafe_code = "forbid"

[package]
name = "colibri-windows"
description = "Windows integration for colibri: patch window, monitors, gamma ramps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
colibri-core = { path = "../colibri-core" }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "=0.61.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_ColorSystem",
    "Win32_UI_WindowsAndMessaging",
]

# Win32 calls need unsafe; lib.rs denies it outside the `win` module.
[lints.rust]
unsafe_code = "deny"

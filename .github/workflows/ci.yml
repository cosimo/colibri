name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - run: cargo run -p colibri-sim --example compare_sensors
      - run: cargo run -p colibri-cli -- simulate --out simulated.icc
      - name: List monitors (Windows API smoke test)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: cargo run -p colibri-cli -- displays
